plugins {
    id 'java-library'
}

// The copied engine sources remain inside this checkout. Never resolve CGSE
// from a sibling checkout or download a binary as a prerequisite to building GTL.
sourceSets.main.java {
    setSrcDirs([rootProject.file('src/main/java')])
    include 'org/cgse/core/**'
}
ext.cgseConfigFile = file('cgse.properties')
ext.cgseIdentityPaths = ['src/main/java/org/cgse', 'cgse-engine/build.gradle',
                         'cgse-engine/engine.gradle', 'cgse-engine/cgse.properties',
                         'cgse-engine/NOTICE']
ext.cgseLicenseFiles = files('NOTICE')
apply from: 'engine.gradle'
