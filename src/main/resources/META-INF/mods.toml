license = "MIT"

[[mods]]
modId = "gtmbsockets"
version = "1.0.3"
displayName = "GT Multiblock Sockets"
displayTest = "IGNORE_ALL_VERSION"
authors = "wcwen"
description = '''
Client-side socket preview for GregTech CEu / GTLCore multiblocks.

Hold a hatch, bus, maintenance hatch or muffler in either hand and every structure cell that
accepts that part is outlined in the world: cyan for a free socket, orange for an occupied or
blocked socket.  Works on formed and unformed controllers, and reads structure patterns from
GTCEu and every addon that uses the standard GT pattern API (including GTLCore).

This is a standalone patch.  It does not modify any GregTech, GTLCore or addon jar.
'''

[[dependencies.gtmbsockets]]
modId = "forge"
mandatory = true
versionRange = "[47,)"
ordering = "NONE"
side = "BOTH"

[[dependencies.gtmbsockets]]
modId = "minecraft"
mandatory = true
versionRange = "[1.20.1,1.21)"
ordering = "NONE"
side = "BOTH"

[[dependencies.gtmbsockets]]
modId = "gtceu"
mandatory = true
versionRange = "[1.4.4,)"
ordering = "AFTER"
side = "BOTH"

[[dependencies.gtmbsockets]]
modId = "gtlcore"
mandatory = false
versionRange = "[1.2.0,)"
ordering = "AFTER"
side = "BOTH"
